services:
  mysql:
    image: mysql:8
    container_name: invoice-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: invoice_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - invoice-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_URL: https://34.132.250.111
      FRONTEND_URL: https://34.132.250.111
      CORS_ALLOWED_ORIGINS: http://34.132.250.111,http://34.132.250.111:3000,https://34.132.250.111,https://34.132.250.111:3000,http://localhost:3000,http://127.0.0.1:3000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: invoice_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      SANCTUM_STATEFUL_DOMAINS: 34.132.250.111
      SESSION_DOMAIN: 34.132.250.111
    ports:
      - "8000:8000"
    networks:
      - invoice-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://34.132.250.111/api
    container_name: invoice-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: https://34.132.250.111/api
    ports:
      - "3000:3000"
    networks:
      - invoice-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: invoice-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: secret
    ports:
      - "8080:80"
    networks:
      - invoice-network

volumes:
  mysql-data:

networks:
  invoice-network:
    name: invoice-network
